[package]
name = "serde-stream-formats"
version = "0.1.0"
description = "Bounded-memory streaming encode and incremental decode for Serde wire formats (JSON, YAML, MessagePack, Postcard) with typed failures"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/serde-stream-formats"
documentation = "https://docs.rs/serde-stream-formats"
readme = "README.md"
build = "build.rs"
keywords = ["serde", "streaming", "json", "msgpack", "bounded-memory"]
categories = ["encoding", "asynchronous", "web-programming"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "build.rs",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[dependencies]
bytes = "1"
postcard = { version = "1", features = ["use-std"] }
rmp-serde = "1"
serde = "1"
serde_json = "1"
serde_yaml2 = "0.1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# `large_futures` computes the layout of every async opaque type; on current
# nightlies that hits a rustc ICE ("unexpected rigid alias in layout_of after
# normalization") for this crate's async test helpers. Stable passes the lint
# clean. Re-enable once the compiler bug is fixed.
large_futures = "allow"
